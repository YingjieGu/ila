# ILA Configuration
ila:
  home: ~/.ila
  auto_approve: false
  max_develop_retries: 3
  health_check_retries: 3
  health_check_interval: 5

sandbox:
  default_level: tempdir
  framework: codex
  # workspace_root 缺省时自动使用系统临时目录 (tempfile.gettempdir())
  workspace_root: null
  codex_model: deepseek-v4-pro
  codex_sandbox_mode: bypass
  timeout: 300

adapters:
  hermes:
    enabled: true
    hermes_home: ~/.hermes
    staging_profile: ila-test
  openclaw:
    enabled: true
    openclaw_home: ~/.openclaw
  workbuddy:
    enabled: true
    workbuddy_home: ~/.workbuddy
  ila:
    enabled: true
    project_root: ~/myprojects/ila
    dashboard_port: 9527
    staging_port: 9528
  custom:
    enabled: false

test:
  default_timeout: 60
  performance_threshold: 1.2
  security_scan: true

report:
  output_dir: ~/.ila/reports
  format: [json, markdown, html]

dashboard:
  theme: dark  # 页面主题: dark(暗色) | light(亮色) | ocean(海洋) | sepia(复古)

self_evolve:
  enabled: true
  require_security_review: true
  protected_files:
    - src/ila/core/roller.py
    - src/ila/core/registry.py
